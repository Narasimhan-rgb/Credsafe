<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#17335c" />
<title>LoanGuard Secure Loan Portal</title>
<style>
:root{--navy:#17335c;--navy2:#244b7e;--blue:#2f6fed;--bg:#f4f7fb;--card:#fff;--text:#243248;--muted:#748196;--line:#dfe6ef;--green:#1f8b4c;--greenbg:#eaf8f0;--amber:#b7791f;--amberbg:#fff7df;--red:#c53030;--redbg:#fff0f0;--shadow:0 10px 30px rgba(20,44,80,.09);--r:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{min-height:100vh}.top{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}.top small{opacity:.75}.wrap{max-width:1180px;margin:0 auto;padding:22px}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:linear-gradient(135deg,#f7faff,#edf3fb)}
.hero{padding:68px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,var(--navy),#10223e);color:#fff}.hero h1{font-size:44px;line-height:1.08;margin:0 0 18px;max-width:650px}.hero p{font-size:17px;line-height:1.7;opacity:.82;max-width:650px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.chip{padding:9px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:999px;font-size:12px}.login-panel{display:flex;align-items:center;justify-content:center;padding:34px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}.login-card h2{margin:6px 0 4px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin:18px 0 7px}.phone{display:flex}.prefix{padding:13px 12px;border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:#f8fafc;color:var(--muted);font-weight:700}.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}.phone .input{border-radius:0 12px 12px 0}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,237,.09)}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800}.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}.btn-outline{background:#fff;border:1px solid var(--line);color:var(--text)}.btn-danger{background:var(--red);color:#fff}.btn-success{background:var(--green);color:#fff}.btn-block{width:100%}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.otp input{text-align:center;font-size:20px;font-weight:800;padding:12px 0;border:1.5px solid var(--line);border-radius:10px;width:100%}.notice{padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.45}.notice-info{background:#eef5ff;color:#28568f}.notice-warn{background:var(--amberbg);color:#7a5114}.notice-danger{background:var(--redbg);color:#8f2424}.notice-ok{background:var(--greenbg);color:#176737}.demo-bar{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}.switch{display:flex;gap:8px}.scenario{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:center;font-size:11px;font-weight:800}.scenario.active{border-color:var(--blue);background:#eef5ff;color:#235caa}.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scenario small{display:block;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.25}.scenario.active small{color:#3b6da9}.auth-stage{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stage{padding:8px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:9px;font-weight:800;color:var(--muted);background:#fff}.stage.ok{background:var(--greenbg);color:var(--green);border-color:#bfe5cf}.stage.block{background:var(--redbg);color:var(--red);border-color:#efc5c5}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 10px rgba(20,44,80,.04);padding:18px}.span8{grid-column:span 8}.span4{grid-column:span 4}.span12{grid-column:span 12}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat b{font-size:26px}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:900}.low{background:var(--greenbg);color:var(--green)}.med{background:var(--amberbg);color:var(--amber)}.high{background:var(--redbg);color:var(--red)}.loan{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:11px}.loan h3{margin:0 0 4px}.kv{display:flex;justify-content:space-between;border-top:1px solid #edf1f6;padding:8px 0;font-size:12px}.kv:first-of-type{margin-top:10px}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.filebox{border:2px dashed #cfd8e6;border-radius:14px;padding:28px;text-align:center;background:#fafcff}.filebox input{display:none}.preview{max-width:100%;max-height:240px;border-radius:12px;margin-top:12px}.sec-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;background:#edf5ff;color:#275a96;font-size:11px;font-weight:800}.trace{display:grid;gap:9px;margin-top:12px}.trace-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#edf4ff;color:var(--blue);font-size:12px;font-weight:900}.priority{font-size:22px;font-weight:900}.blocked{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#fff7f7,#f6f9ff)}.blocked-card{width:min(680px,100%);background:#fff;border:1px solid #f0cccc;border-radius:22px;box-shadow:var(--shadow);padding:30px}.blocked-icon{width:70px;height:70px;border-radius:18px;background:var(--redbg);color:var(--red);display:grid;place-items:center;font-size:32px}.soc-drawer{position:fixed;inset:0;background:rgba(11,25,45,.58);z-index:100;display:flex;justify-content:flex-end}.soc-panel{width:min(620px,100%);height:100%;overflow:auto;background:#f7f9fc;padding:22px}.soc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.req{border-left:4px solid var(--blue);padding:11px 13px;background:#fff;border-radius:10px;margin:8px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.req b{display:block;font-size:12px;margin-bottom:3px}.req span{font-size:11px;color:var(--muted)}.footer-note{font-size:10px;color:var(--muted);margin-top:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:800;padding:0;cursor:pointer}.auth-switch{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
@media(max-width:850px){.login-wrap{grid-template-columns:1fr}.hero{display:none}.login-panel{padding:18px;min-height:100vh}.wrap{padding:14px}.span8,.span4{grid-column:span 12}.top{padding:0 14px}.grid{gap:12px}.actions .btn{flex:1}.login-card{padding:22px}.otp{gap:5px}.otp input{font-size:18px}.soc-panel{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CONFIG={apiBase:'/api',demoOtp:'123456',badIp:'198.51.100.66',normalIp:'203.0.113.25',rapidWindowMs:60000,rapidThreshold:4};
const state={screen:'login',authMode:'login',step:'mobile',mobile:'',otp:['','','','','',''],scenario:'normal',user:null,authUser:null,security:null,otpVerified:false,registration:{fullName:'',mobileNumber:'',email:'',state:'Tamil Nadu',district:'',address:''},lastRegisteredUser:null,loan:{id:1,loanNumber:'LN-001',purpose:'Purchase of business equipment',amount:100000,status:'UNDER_VERIFICATION'},evidence:null,soc:false,apiMode:'checking'};
function fingerprint(){let id=localStorage.getItem('loanguard_device');if(!id){id='DEV-'+crypto.randomUUID().slice(0,8);localStorage.setItem('loanguard_device',id)}return id}
function h(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function scenarioMeta(){
 const m={
  normal:{title:'Normal login',desc:'Known device + clean IP + normal behaviour',ip:CONFIG.normalIp,device:fingerprint(),newDevice:false,rapid:false,abnormal:false,geo:false},
  rapid:{title:'Multiple rapid logins',desc:'Several sign-ins for the same account in a short window',ip:CONFIG.normalIp,device:fingerprint(),newDevice:false,rapid:true,abnormal:true,geo:false},
  badip:{title:'Suspicious IP + valid OTP',desc:'Attacker has the correct OTP but connects from threat-listed IP',ip:CONFIG.badIp,device:fingerprint(),newDevice:false,rapid:false,abnormal:true,geo:true},
  takeover:{title:'Account takeover',desc:'Valid OTP + new device + threat IP + abnormal behaviour',ip:CONFIG.badIp,device:'UNKNOWN-HACKER-PC',newDevice:true,rapid:true,abnormal:true,geo:true}
 };
 return m[state.scenario]||m.normal;
}
function loginHistoryKey(){return 'loanguard_login_history_'+state.mobile}
function recentLoginCount(){try{const now=Date.now();const a=JSON.parse(localStorage.getItem(loginHistoryKey())||'[]').filter(t=>now-t<CONFIG.rapidWindowMs);return a.length}catch{return 0}}
function recordLoginAttempt(forceRapid=false){try{const now=Date.now();let a=JSON.parse(localStorage.getItem(loginHistoryKey())||'[]').filter(t=>now-t<CONFIG.rapidWindowMs);a.push(now);if(forceRapid){while(a.length<CONFIG.rapidThreshold+1)a.push(now-(a.length*3000))}localStorage.setItem(loginHistoryKey(),JSON.stringify(a));return a.length}catch{return forceRapid?5:1}}
function browserName(){const u=navigator.userAgent;return /Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Firefox\//.test(u)?'Firefox':'Browser'}

async function jsonFetch(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={message:text}}if(!r.ok)throw Object.assign(new Error(data.message||('HTTP '+r.status)),{status:r.status,data});return data}
async function requestOtp(){
 if(!/^\d{10}$/.test(state.mobile)){alert('Enter a valid 10-digit mobile number');return}
 recordLoginAttempt(state.scenario==='rapid'||state.scenario==='takeover');
 try{
  await jsonFetch(CONFIG.apiBase+'/auth/request-otp',{method:'POST',body:JSON.stringify({mobileNumber:state.mobile})});
  state.apiMode='live';state.step='otp';state.otpVerified=false;render();
 }catch(e){
  const msg=String(e?.message||'');
  if(/user not found/i.test(msg)||e?.status===404){alert('No account exists for this mobile number. Please create an account first.');state.registration.mobileNumber=state.mobile;state.authMode='register';render();return}
  if(!e?.status||e.status>=502){state.apiMode='demo';state.step='otp';state.otpVerified=false;render();return}
  alert('Could not request OTP: '+msg)
 }
}
function setReg(field,value){state.registration[field]=value}
async function registerAccount(){const r=state.registration;if(!r.fullName.trim()){alert('Enter your full name');return}if(!/^\d{10}$/.test(r.mobileNumber)){alert('Enter a valid 10-digit mobile number');return}if(!r.district.trim()){alert('Enter your district');return}try{const result=await jsonFetch(CONFIG.apiBase+'/auth/register',{method:'POST',body:JSON.stringify({fullName:r.fullName.trim(),mobileNumber:r.mobileNumber,email:r.email.trim()||null,state:r.state.trim()||'Tamil Nadu',district:r.district.trim(),address:r.address.trim()||null})});state.lastRegisteredUser=result;state.mobile=r.mobileNumber;state.authMode='login';state.step='mobile';state.apiMode='live';alert('Account created successfully. Now request OTP and sign in.');render()}catch(e){alert('Account creation failed: '+(e?.message||'Unknown error'))}}
function openRegister(){state.authMode='register';state.registration.mobileNumber=state.mobile||state.registration.mobileNumber;render()}
function backToLogin(){state.authMode='login';state.step='mobile';state.mobile=state.registration.mobileNumber||state.mobile;render()}
function otpInput(i,v){state.otp[i]=v.replace(/\D/g,'').slice(-1);render();if(state.otp[i]&&i<5)setTimeout(()=>document.getElementById('o'+(i+1))?.focus(),0)}
function correlationEngine(){
 const meta=scenarioMeta();
 const attempts=Math.max(recentLoginCount(),meta.rapid?CONFIG.rapidThreshold+1:1);
 const events=[
  {name:'Identity / OTP',detail:'OTP verified for '+state.mobile+' — credential possession alone is not sufficient for trust',score:0},
  {name:'Device behaviour',detail:meta.newDevice?'New / untrusted device fingerprint: '+meta.device:'Known device continuity: '+meta.device,score:meta.newDevice?22:2},
  {name:'CTI / IP reputation',detail:meta.ip===CONFIG.badIp?meta.ip+' matched a threat-intelligence IOC':'No relevant CTI match for '+meta.ip,score:meta.ip===CONFIG.badIp?48:0},
  {name:'Login velocity',detail:attempts+' login/request events observed inside the last 60 seconds',score:attempts>=CONFIG.rapidThreshold?30:2},
  {name:'Behavioural analytics',detail:meta.abnormal?'Access pattern deviates from the beneficiary baseline':'Login time and access pattern within baseline',score:meta.abnormal?16:2},
  {name:'Geo / session context',detail:meta.geo?'Session origin differs from recent trusted context':'Location/session context is plausible',score:meta.geo?12:1}
 ];
 const risk=Math.min(100,events.reduce((a,e)=>a+e.score,0));
 const severity=risk>=80?'CRITICAL':risk>=60?'HIGH':risk>=35?'MEDIUM':'LOW';
 const priority=severity==='CRITICAL'?'P1':severity==='HIGH'?'P2':severity==='MEDIUM'?'P3':'P4';
 const action=severity==='CRITICAL'?'BLOCK_LOGIN_AND_OPEN_INCIDENT':severity==='HIGH'?'BLOCK_SESSION_AND_INVESTIGATE':severity==='MEDIUM'?'REQUIRE_STEP_UP_MFA':'ALLOW_AND_MONITOR';
 let recommendations;
 if(severity==='LOW') recommendations=['Allow login','Continue behavioural monitoring'];
 else if(severity==='MEDIUM') recommendations=['Do not trust OTP alone','Require step-up identity verification','Increase session monitoring','Create review event'];
 else recommendations=['Deny or revoke session','Create prioritized security incident','Preserve correlated event evidence','Require identity re-validation','Recommend analyst review'];
 return {risk,severity,priority,action,events,recommendations,incidentId:'INC-'+Date.now().toString().slice(-7),correlated:events.length,ctiRelevant:meta.ip===CONFIG.badIp,attempts,scenario:state.scenario,scenarioTitle:meta.title,otpVerified:true};
}
async function assessSecurity(){
 const local=correlationEngine();const meta=scenarioMeta();
 try{
  const payload={userId:Number(state.authUser?.userId??state.authUser?.id??state.lastRegisteredUser?.userId??1),mobileNumber:state.mobile,ipAddress:meta.ip,deviceFingerprint:meta.device,latitude:meta.geo?28.6139:13.0827,longitude:meta.geo?77.2090:80.2707,eventType:'LOGIN',newDevice:meta.newDevice,abnormalBehaviour:meta.abnormal,recentLoginAttempts:local.attempts,otpVerified:true,browser:browserName(),userAgent:navigator.userAgent};
  const live=await jsonFetch(CONFIG.apiBase+'/security/assess',{method:'POST',body:JSON.stringify(payload)});
  state.apiMode='live';
  const liveRisk=Number(live.riskScore??live.score??0);
  const risk=Math.max(local.risk,Number.isFinite(liveRisk)?liveRisk:0);
  const severity=risk>=80?'CRITICAL':risk>=60?'HIGH':risk>=35?'MEDIUM':'LOW';
  const action=risk>=80?'BLOCK_LOGIN_AND_OPEN_INCIDENT':risk>=60?'BLOCK_SESSION_AND_INVESTIGATE':risk>=35?'REQUIRE_STEP_UP_MFA':'ALLOW_AND_MONITOR';
  return {...local,...live,risk,severity,action,priority:severity==='CRITICAL'?'P1':severity==='HIGH'?'P2':severity==='MEDIUM'?'P3':'P4',events:local.events,recommendations:local.recommendations,attempts:local.attempts,otpVerified:true};
 }catch(e){state.apiMode='demo';return local}
}
async function verifyLogin(){
 if(state.otp.join('').length!==6){alert('Enter the complete 6-digit OTP');return}
 const meta=scenarioMeta();let otpOk=true;let authResult=null;
 const verifyPayload={mobileNumber:state.mobile,otp:state.otp.join(''),deviceFingerprint:meta.device,deviceName:meta.newDevice?'Unknown device':'Trusted browser device',browser:browserName(),operatingSystem:navigator.platform||'Browser',ipAddress:meta.ip,latitude:meta.geo?28.6139:13.0827,longitude:meta.geo?77.2090:80.2707};
 try{
  authResult=await jsonFetch(CONFIG.apiBase+'/auth/verify-otp',{method:'POST',body:JSON.stringify(verifyPayload)});
  state.apiMode='live';state.authUser=authResult;state.otpVerified=true;
 }catch(e){
  if(state.apiMode==='live'){otpOk=false}else otpOk=state.otp.join('')===CONFIG.demoOtp;
  state.otpVerified=otpOk;
 }
 if(!otpOk){alert('OTP verification failed. Request a fresh OTP from Spring Boot and try again.');return}
 state.security=await assessSecurity();
 const risk=Number(state.security.risk??0);const action=String(state.security.action||'');
 if(risk>=60||action.includes('BLOCK')){state.screen='blocked';state.user=null}
 else if(risk>=35||action.includes('STEP_UP')){state.screen='blocked';state.user=null}
 else{const a=authResult||state.lastRegisteredUser||{};state.user={id:a.userId??a.id??1,name:a.fullName??a.name??state.registration.fullName??'Beneficiary',mobile:state.mobile,role:a.role??'BENEFICIARY',beneficiaryCode:a.beneficiaryCode??state.lastRegisteredUser?.beneficiaryCode??'BEN-NEW',district:a.district??state.registration.district??'Chennai',state:a.state??state.registration.state??'Tamil Nadu'};state.screen='dashboard'}
 render()
}
function logout(){state.user=null;state.authUser=null;state.security=null;state.otpVerified=false;state.screen='login';state.authMode='login';state.step='mobile';state.otp=['','','','','',''];render()}
function chooseScenario(x){state.scenario=x;state.security=null;state.otpVerified=false;render()}
function openSoc(){state.soc=true;render()}function closeSoc(){state.soc=false;render()}
function pickEvidence(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.evidence={name:f.name,url:r.result,lat:13.0827,lng:80.2707,time:new Date().toISOString()};render()};r.readAsDataURL(f)}
async function submitEvidence(){if(!state.evidence){alert('Choose or capture a photo first');return}alert('Evidence ready. Your Spring Boot / FastAPI verification endpoint can now process this upload.');}
function securityBadge(){if(!state.security)return'';const c=state.security.severity==='LOW'?'low':state.security.severity==='MEDIUM'?'med':'high';return `<span class="badge ${c}">Security ${h(state.security.severity)} · ${h(state.security.risk)}/100</span>`}
function login(){const meta=scenarioMeta();return `<div class="login-wrap"><section class="hero"><div class="logo">🛡️</div><h1>LoanGuard — secure loan utilization with AI protection</h1><p>Users sign in normally with mobile + OTP. Behind the login, LoanGuard correlates device, login velocity, behavioural context and cyber-threat intelligence so even a stolen or valid OTP does not automatically create a trusted session.</p><div class="chips"><span class="chip">Account enrollment</span><span class="chip">CTI relevance</span><span class="chip">Multi-login correlation</span><span class="chip">Behaviour analytics</span><span class="chip">Incident priority</span><span class="chip">Automated response</span></div></section><section class="login-panel"><div class="login-card"><div class="row"><div class="logo" style="background:var(--navy);color:#fff">₹</div><div><b>LoanGuard</b><div class="sub">${state.authMode==='register'?'Create beneficiary account':'Secure beneficiary login'}</div></div></div>${state.authMode==='register'?registerStep():(state.step==='mobile'?mobileStep():otpStep())}${state.authMode==='login'?`<div class="demo-bar"><div class="label">Live security test cases</div><div class="scenario-grid"><button class="scenario ${state.scenario==='normal'?'active':''}" onclick="chooseScenario('normal')">✓ Normal login<small>Clean IP + known device</small></button><button class="scenario ${state.scenario==='rapid'?'active':''}" onclick="chooseScenario('rapid')">↻ Multiple logins<small>5 attempts in 60 sec</small></button><button class="scenario ${state.scenario==='badip'?'active':''}" onclick="chooseScenario('badip')">⚠ Suspicious IP<small>Correct OTP + CTI match</small></button><button class="scenario ${state.scenario==='takeover'?'active':''}" onclick="chooseScenario('takeover')">⛔ Account takeover<small>OTP + new device + bad IP</small></button></div><div class="notice ${state.scenario==='normal'?'notice-info':'notice-warn'}" style="margin-top:10px"><b>${h(meta.title)}</b><br>${h(meta.desc)}</div><button class="btn btn-outline btn-block" style="margin-top:10px" onclick="openSoc()">Show AI SOC mapping</button><div class="footer-note">For Suspicious IP / Account Takeover, OTP is still requested and can be correct. The session is blocked by correlated context after identity proof.</div></div>`:''}</div></section>${socDrawer()}</div>`}

function mobileStep(){return `<h2>User login</h2><div class="sub">Sign in with the mobile number used when you created your account.</div><div class="label">Mobile number</div><div class="phone"><div class="prefix">+91</div><input class="input" maxlength="10" inputmode="numeric" value="${h(state.mobile)}" oninput="state.mobile=this.value.replace(/\D/g,'')"></div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="requestOtp()">Request OTP</button><div class="auth-switch">New beneficiary? <button class="linkbtn" onclick="openRegister()">Create account</button></div>`}
function registerStep(){const r=state.registration;return `<h2>Create account</h2><div class="sub">Create a beneficiary profile once, then use mobile + OTP for future logins.</div><div class="label">Full name</div><input class="input" value="${h(r.fullName)}" oninput="setReg('fullName',this.value)" placeholder="Your full name"><div class="label">Mobile number</div><div class="phone"><div class="prefix">+91</div><input class="input" maxlength="10" inputmode="numeric" value="${h(r.mobileNumber)}" oninput="setReg('mobileNumber',this.value.replace(/\D/g,''))" placeholder="10-digit mobile"></div><div class="label">Email (optional)</div><input class="input" type="email" value="${h(r.email)}" oninput="setReg('email',this.value)" placeholder="name@example.com"><div class="form-grid"><div><div class="label">State</div><input class="input" value="${h(r.state)}" oninput="setReg('state',this.value)"></div><div><div class="label">District</div><input class="input" value="${h(r.district)}" oninput="setReg('district',this.value)" placeholder="Chennai"></div></div><div class="label">Address (optional)</div><input class="input" value="${h(r.address)}" oninput="setReg('address',this.value)" placeholder="Address"><button class="btn btn-primary btn-block" style="margin-top:16px" onclick="registerAccount()">Create beneficiary account</button><button class="btn btn-outline btn-block" style="margin-top:8px" onclick="backToLogin()">Already have an account? Sign in</button><div class="notice notice-info" style="margin-top:12px">Security monitoring begins at login. Account creation itself does not mark a user suspicious.</div>`}
function otpStep(){const meta=scenarioMeta();return `<h2>Verify OTP</h2><div class="sub">OTP sent to +91 ${h(state.mobile)}. ${state.apiMode==='demo'?'Demo fallback OTP: 123456':''}</div><div class="label">6-digit OTP</div><div class="otp">${state.otp.map((v,i)=>`<input id="o${i}" inputmode="numeric" maxlength="1" value="${v}" oninput="otpInput(${i},this.value)">`).join('')}</div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="verifyLogin()">Verify OTP & evaluate session</button><button class="btn btn-outline btn-block" style="margin-top:8px" onclick="state.step='mobile';render()">Back</button><div class="auth-stage"><div class="stage">1. OTP issued</div><div class="stage">2. OTP verified</div><div class="stage ${state.scenario==='normal'?'':'block'}">3. Session risk</div></div><div class="notice ${state.scenario==='normal'?'notice-info':'notice-warn'}" style="margin-top:12px"><b>${h(meta.title)}</b><br>${state.scenario==='normal'?'Correct OTP + trusted context → allow session.':state.scenario==='rapid'?'Correct OTP can still be challenged or blocked when repeated logins exceed the velocity threshold.':state.scenario==='badip'?'The OTP can be completely correct; CTI identifies the source IP as suspicious and blocks the session.':'The OTP can be correct; new device + threat IP + rapid logins + behaviour anomaly correlate into a critical account-takeover incident.'}</div>`}

function dashboard(){return `<div class="app"><div class="top"><div class="brand"><div class="logo">₹</div>LoanGuard</div><div class="row">${securityBadge()}<button class="btn btn-outline" onclick="openSoc()">Judge security trace</button><button class="btn btn-outline" onclick="logout()">Logout</button></div></div><div class="wrap"><div class="grid"><div class="card span8"><div class="row between"><div><div class="muted" style="font-size:12px">Welcome</div><h2 style="margin:2px 0">${h(state.user.name)}</h2><div class="muted" style="font-size:12px">${h(state.user.beneficiaryCode)} · ${h(state.user.district||'')} ${state.user.state?'· '+h(state.user.state):''}</div></div><span class="sec-pill">🛡️ Session protected in background</span></div><div class="loan"><div class="row between"><div><h3>${h(state.loan.purpose)}</h3><div class="muted">${h(state.loan.loanNumber)}</div></div><span class="badge med">${h(state.loan.status)}</span></div><div class="kv"><span class="muted">Loan amount</span><b>₹${state.loan.amount.toLocaleString('en-IN')}</b></div><div class="kv"><span class="muted">Evidence required</span><span>Geo-tagged photo / video</span></div><div class="actions"><button class="btn btn-primary" onclick="document.getElementById('file').click()">Capture / choose evidence</button><input id="file" type="file" accept="image/*" capture="environment" style="display:none" onchange="pickEvidence(this)"><button class="btn btn-outline" onclick="submitEvidence()">Submit for AI verification</button></div>${state.evidence?`<img class="preview" src="${state.evidence.url}"><div class="notice notice-info" style="margin-top:10px">Captured ${h(state.evidence.name)} · ${state.evidence.lat}, ${state.evidence.lng} · ${new Date(state.evidence.time).toLocaleString()}</div>`:''}</div></div><div class="card span4"><div class="stat"><div><div class="muted" style="font-size:11px;text-transform:uppercase;font-weight:800">Session trust</div><b>${100-(state.security?.risk||0)}%</b></div>${securityBadge()}</div><div class="trace">${(state.security?.events||[]).slice(0,3).map((e,i)=>`<div class="trace-item"><div class="dot">${i+1}</div><div><b style="font-size:12px">${h(e.name)}</b><div class="muted" style="font-size:10px">${h(e.detail)}</div></div><span class="badge ${e.score>15?'high':'low'}">${e.score}</span></div>`).join('')}</div><div class="footer-note">Security signals are evaluated in the background; the beneficiary remains in the normal loan workflow.</div></div></div></div>${socDrawer()}</div>`}
function blocked(){const s=state.security||correlationEngine();return `<div class="blocked"><div class="blocked-card"><div class="row between"><div class="blocked-icon">⛔</div><span class="badge high">${h(s?.priority||'P1')} · ${h(s?.severity||'CRITICAL')}</span></div><h1>${s.severity==='MEDIUM'?'Additional verification required':'Suspicious session blocked'}</h1><p class="muted"><b>OTP status: VERIFIED.</b> Identity proof succeeded, but LoanGuard did not trust the session because correlated cyber context exceeded the policy threshold.</p><div class="auth-stage"><div class="stage ok">✓ OTP issued</div><div class="stage ok">✓ OTP verified</div><div class="stage block">✕ Session denied</div></div><div class="grid" style="margin-top:18px"><div class="card span4"><div class="muted" style="font-size:11px">Risk score</div><div class="priority">${h(s?.risk||95)}/100</div></div><div class="card span4"><div class="muted" style="font-size:11px">Recent logins</div><div class="priority">${h(s?.attempts||1)}</div></div><div class="card span4"><div class="muted" style="font-size:11px">Incident</div><div style="font-weight:900;margin-top:7px">${h(s?.incidentId)}</div></div></div><div class="label">Automated measures taken</div>${(s?.recommendations||[]).map(x=>`<div class="notice notice-danger" style="margin-bottom:7px">✓ ${h(x)}</div>`).join('')}<div class="label">Correlated evidence</div><div class="trace">${(s?.events||[]).map((e,i)=>`<div class="trace-item"><div class="dot">${i+1}</div><div><b style="font-size:12px">${h(e.name)}</b><div class="muted" style="font-size:10px">${h(e.detail)}</div></div><span class="badge ${e.score>=15?'high':'low'}">+${e.score}</span></div>`).join('')}</div><div class="actions"><button class="btn btn-outline" onclick="openSoc()">Explain against problem statement</button><button class="btn btn-primary" onclick="logout()">Return to login</button></div><div class="footer-note">This test demonstrates why OTP alone is not enough: the AI SOC correlates CTI, login velocity, device and behavioural signals before trusting the session.</div></div>${socDrawer()}</div>`}

function socDrawer(){if(!state.soc)return'';const s=state.security||correlationEngine();return `<div class="soc-drawer" onclick="if(event.target===this)closeSoc()"><aside class="soc-panel"><div class="soc-head"><div><h2 style="margin:0">Judge View — AI SOC contribution</h2><div class="sub">How the user-login test cases map to AI-powered Cyber Threat Intelligence</div></div><button class="btn btn-outline" onclick="closeSoc()">Close</button></div><div class="req"><b>1. Threat intelligence relevance</b><span>A suspicious IP is not shown as a raw feed. It becomes relevant when it is linked to an active beneficiary login or session.</span></div><div class="req"><b>2. Multiple-login correlation</b><span>Repeated authentication activity for the same account is grouped into one login-velocity signal (${h(s.attempts||1)} recent events), reducing alert noise.</span></div><div class="req"><b>3. Compromised OTP scenario</b><span>OTP can be valid and identity proof can succeed. Session trust is evaluated separately using device continuity, CTI, behaviour and geo/session context.</span></div><div class="req"><b>4. Automatic event correlation</b><span>${h(s.correlated)} observations are merged into one incident hypothesis rather than forcing an analyst to investigate independent alerts.</span></div><div class="req"><b>5. Incident prioritization</b><span>Current incident → ${h(s.priority)} / ${h(s.severity)} with risk ${h(s.risk)}/100. Critical account-takeover patterns rise to P1.</span></div><div class="req"><b>6. Behavioural analytics</b><span>Known-vs-new device, login velocity, access pattern and session origin contribute to the decision instead of relying on one IOC.</span></div><div class="req"><b>7. Automated investigation</b><span>The system collects correlated evidence, explains each contributing factor, creates an incident ID and preserves an auditable evidence chain.</span></div><div class="req"><b>8. Recommended or automated response</b><span>LOW → allow and monitor. MEDIUM → step-up identity verification. HIGH/CRITICAL → block or revoke session, create incident and recommend analyst review.</span></div><div class="label">Test cases included</div><div class="notice notice-info">Normal login → ALLOW<br>Multiple rapid logins → HIGH / BLOCK or STEP-UP<br>Suspicious CTI IP + correct OTP → HIGH / BLOCK<br>Correct OTP + new device + CTI IP + abnormal behaviour → CRITICAL P1 / BLOCK</div><div class="label">Closed-loop flow</div><div class="notice notice-info">OTP identity proof → Contextualize CTI → Correlate events → Score incident → Prioritize → Execute or recommend response → Preserve incident evidence</div></aside></div>`}

function render(){const root=document.getElementById('root');root.innerHTML=state.screen==='login'?login():state.screen==='blocked'?blocked():dashboard()}
render();
</script>
</body>
</html>
